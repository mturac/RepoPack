name: Materialize source

on:
  push:
    branches: [feat/repopack-core]
    paths:
      - ".bootstrap/chunks/**"
      - "docs/assets/repopack-hero.png"
      - ".github/workflows/materialize-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/repopack-core
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunks/part.* | tr -d '\r\n' | base64 --decode > /tmp/repopack-source.tar.gz
          echo "f858e4d5ae40ce2e9156cc945ffd4f70ccec9a72ceff427463b87066d30f4619  /tmp/repopack-source.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/repopack-source.tar.gz | grep -Fxq './package.json'
          tar -tzf /tmp/repopack-source.tar.gz | grep -Fxq './src/build.ts'
          tar -tzf /tmp/repopack-source.tar.gz | grep -Fxq './test/build.test.mjs'
          test -f docs/assets/repopack-hero.png

      - name: Materialize repository source
        shell: bash
        run: |
          set -euo pipefail
          cp docs/assets/repopack-hero.png /tmp/repopack-hero.png
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/repopack-source.tar.gz -C .
          mkdir -p docs/assets
          cp /tmp/repopack-hero.png docs/assets/repopack-hero.png
          chmod +x bin/repopack.mjs

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic repository context compiler"
          git push origin HEAD:feat/repopack-core
